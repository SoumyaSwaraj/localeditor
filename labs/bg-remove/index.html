<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Background remover lab</title>
<style>
  :root { --bg:#faf8f4; --ink:#17131f; --mute:#6b6577; --card:#fff; --line:#e3ded5; --gold:#e8b84a; --goldink:#2a1f0a; }
  @media (prefers-color-scheme: dark) { :root { --bg:#17131f; --ink:#f3efe8; --mute:#a59fb2; --card:#221c2d; --line:#362e45; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 20px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p.lead { color: var(--mute); margin: 0 0 16px; }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:14px; }
  .row { display:flex; flex-wrap:wrap; gap:12px; align-items:end; }
  label { display:flex; flex-direction:column; gap:4px; font-size:13px; color:var(--mute); }
  select, input[type=number], input[type=range] { min-height:44px; font:inherit; color:var(--ink); background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:0 8px; }
  input[type=range] { padding:0; }
  label.chk { flex-direction:row; align-items:center; gap:8px; min-height:44px; color:var(--ink); }
  button, .btn { min-height:44px; padding:0 16px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--ink); font:inherit; font-weight:600; cursor:pointer; display:inline-flex; align-items:center; }
  button.gold { background:var(--gold); border-color:var(--gold); color:var(--goldink); }
  button:disabled { opacity:.5; cursor:default; }
  #drop { border:2px dashed var(--line); border-radius:12px; padding:22px; text-align:center; color:var(--mute); }
  #drop.over { border-color:var(--gold); background:rgba(232,184,74,.12); }
  progress { width:100%; height:10px; }
  #status { color:var(--mute); min-height:22px; margin:8px 0 0; }
  .stage { position:relative; width:100%; border-radius:10px; overflow:hidden; border:1px solid var(--line); background-color:#fff;
    background-image:linear-gradient(45deg,#ccc 25%,transparent 25%,transparent 75%,#ccc 75%),linear-gradient(45deg,#ccc 25%,transparent 25%,transparent 75%,#ccc 75%);
    background-size:20px 20px; background-position:0 0,10px 10px; }
  .stage.flat { background-image:none; }
  .stage canvas { display:block; width:100%; height:auto; }
  #before { position:absolute; inset:0; clip-path: inset(0 50% 0 0); }
  #before canvas { width:100%; height:100%; object-fit:contain; }
  #cmp { width:100%; }
  table { border-collapse:collapse; width:100%; font-size:13px; font-variant-numeric:tabular-nums; }
  td, th { text-align:left; padding:4px 8px; border-bottom:1px solid var(--line); }
  .hidden { display:none; }
  .hint { font-size:12px; color:var(--mute); }
</style>
</head>
<body>
<main>
  <h1>Background remover lab</h1>
  <p class="lead">Runs entirely in this tab. Nothing is downloaded until you press <b>Remove background</b>.</p>

  <div class="panel">
    <div id="drop">Drop a photo here, or <label class="btn" style="display:inline-flex;color:var(--ink)">Choose a photo<input id="file" type="file" accept="image/*" class="hidden"></label></div>
    <p class="hint" id="srcinfo"></p>
  </div>

  <div class="panel">
    <div class="row">
      <label>Model <select id="model"></select></label>
      <label>Engine <select id="ep"><option value="wasm">WASM (CPU)</option><option value="webgpu">WebGPU</option><option value="auto">Auto</option></select></label>
      <label>Threads <select id="threads"><option>1</option><option>2</option><option>4</option></select></label>
      <label>Edge <select id="refine"><option value="guided">Guided refine + crisp</option><option value="none">Bilinear only</option></select></label>
      <label>Feather <input id="feather" type="number" min="0" max="20" value="0" style="width:70px"></label>
      <label>Max side <input id="maxside" type="number" min="512" max="4096" step="256" value="2048" style="width:90px"></label>
      <label class="chk"><input id="decon" type="checkbox" checked> Clean edge colour</label>
      <button id="go" class="gold" disabled>Remove background</button>
      <button id="cancel" class="hidden">Cancel</button>
    </div>
    <p id="status" role="status"></p>
    <progress id="prog" max="1" value="0" class="hidden"></progress>
    <p class="hint" id="iso"></p>
  </div>

  <div id="result" class="hidden">
    <div class="panel">
      <div class="row" style="margin-bottom:10px">
        <label>Backdrop <select id="bgsel"><option value="checker">Checkerboard</option><option value="#ffffff">White</option><option value="#17131f">Black</option><option value="#1fa37a">Green</option><option value="#d9423a">Red</option></select></label>
        <label style="flex:1;min-width:200px">Before / after <input id="cmp" type="range" min="0" max="100" value="0"></label>
        <button id="save">Download PNG</button>
      </div>
      <div class="stage" id="stage"><canvas id="out"></canvas><div id="before"></div></div>
    </div>
    <div class="panel"><table id="times"></table></div>
  </div>
</main>
<script src="../../assets/js/le-bgremove.js"></script>
<script src="bg-remove.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var bg = window.LE.bgRemove, srcCanvas = null, last = null, abort = null;

  function mb(n) { return (n / 1048576).toFixed(n < 1e7 ? 1 : 0) + ' MB'; }
  function status(t) { $('status').textContent = t; }

  /* model list */
  bg.models().forEach(function (m) {
    var o = document.createElement('option'); o.value = m.id;
    o.textContent = m.label + ' · ' + m.size + 'px · ' + mb(m.bytes) + (m.bundled ? '' : ' (local only)');
    $('model').appendChild(o);
  });
  $('iso').textContent = window.crossOriginIsolated ? 'Cross-origin isolated: multi-thread WASM is available.' : 'Not cross-origin isolated: WASM runs on one thread.';
  function checkAvail() {
    bg.isAvailable($('model').value).then(function (ok) {
      $('go').disabled = !srcCanvas || !ok;
      if (!ok) status('That model file is not hosted here. Run node scripts/fetch-models.js for evaluation models.');
      else if (srcCanvas) status('');
    });
  }
  $('model').onchange = checkAvail;

  /* source */
  async function setSource(blob) {
    var bmp = await createImageBitmap(blob);
    srcCanvas = document.createElement('canvas'); srcCanvas.width = bmp.width; srcCanvas.height = bmp.height;
    srcCanvas.getContext('2d').drawImage(bmp, 0, 0); bmp.close();
    $('srcinfo').textContent = srcCanvas.width + ' × ' + srcCanvas.height + ' px, ' + mb(blob.size || 0);
    $('result').classList.add('hidden');
    checkAvail();
  }
  $('file').onchange = function () { if (this.files[0]) setSource(this.files[0]); };
  var drop = $('drop');
  ['dragenter', 'dragover'].forEach(function (t) { drop.addEventListener(t, function (e) { e.preventDefault(); drop.classList.add('over'); }); });
  ['dragleave', 'drop'].forEach(function (t) { drop.addEventListener(t, function (e) { e.preventDefault(); drop.classList.remove('over'); }); });
  drop.addEventListener('drop', function (e) { var f = e.dataTransfer.files[0]; if (f) setSource(f); });

  /* run */
  async function go() {
    var o = { ep: $('ep').value, threads: +$('threads').value };
    $('go').disabled = true; $('cancel').classList.remove('hidden'); $('prog').classList.remove('hidden');
    abort = new AbortController();
    var t0 = performance.now();
    try {
      status('Loading model…');
      var info = await bg.load($('model').value, function (p) {
        $('prog').value = p.fraction;
        status(p.cached ? 'Reading cached model…' : p.stage === 'starting' ? 'Starting engine…' : 'Downloading model… ' + mb(p.loaded) + ' of ' + mb(p.total));
      }, o);
      var loadMs = performance.now() - t0;
      $('prog').classList.add('hidden');
      status('Removing background…');
      var res = await bg.run(srcCanvas, {
        refine: $('refine').value, harden: $('refine').value === 'guided' ? [0.2, 0.8] : undefined, feather: +$('feather').value, maxSide: +$('maxside').value,
        decontaminate: $('decon').checked, stats: true, signal: abort.signal
      });
      last = { res: res, info: info, loadMs: loadMs };
      show(); status('Done.');
    } catch (e) {
      status(e.name === 'AbortError' ? 'Cancelled.' : 'Failed: ' + e.message);
      window.__bgError = e.message;
    } finally {
      $('cancel').classList.add('hidden'); $('prog').classList.add('hidden'); $('go').disabled = false;
    }
  }
  $('go').onclick = go;
  $('cancel').onclick = function () { if (abort) abort.abort(); };

  /* result */
  function show() {
    var r = last.res, out = $('out');
    out.width = r.width; out.height = r.height;
    out.getContext('2d').drawImage(r.canvas, 0, 0);
    var b = $('before'); b.innerHTML = '';
    var c = document.createElement('canvas'); c.width = r.width; c.height = r.height;
    c.getContext('2d').drawImage(srcCanvas, 0, 0, r.width, r.height);
    b.appendChild(c);
    $('stage').style.aspectRatio = r.width + ' / ' + r.height;
    backdrop();
    var t = r.timings, st = r.stats || {}, rows = [
      ['Model', last.info.model + (last.info.fromCache ? ' (from Cache Storage)' : '')],
      ['Engine', last.info.ep + ', ' + last.info.threads + ' thread(s)'],
      ['Load (fetch + session)', Math.round(last.loadMs) + ' ms  (session ' + Math.round(last.info.timings.sessionMs) + ', warm-up ' + Math.round(last.info.timings.warmupMs) + ')'],
      ['Decode / resize / normalise', Math.round(t.decodeMs + t.preMs) + ' ms'],
      ['Inference', Math.round(t.inferMs) + ' ms'],
      ['Mask upscale', Math.round(t.upMs) + ' ms'],
      ['Refine + feather', Math.round(t.refineMs) + ' ms'],
      ['Compose', Math.round(t.composeMs) + ' ms'],
      ['Total after load', Math.round(t.totalMs) + ' ms'],
      ['Edge alignment (before → after)', (st.edgeBefore || 0).toFixed(4) + ' → ' + (st.edgeAfter || 0).toFixed(4)]
    ];
    $('times').innerHTML = rows.map(function (x) { return '<tr><th>' + x[0] + '</th><td>' + x[1] + '</td></tr>'; }).join('');
    $('result').classList.remove('hidden');
    $('out').parentNode.setAttribute('data-state', 'done');
    window.__bgDone = { w: r.width, h: r.height, timings: t, stats: st, info: last.info };
  }
  function backdrop() {
    var v = $('bgsel').value, s = $('stage');
    if (v === 'checker') { s.classList.remove('flat'); s.style.backgroundColor = '#fff'; }
    else { s.classList.add('flat'); s.style.backgroundColor = v; }
  }
  $('bgsel').onchange = backdrop;
  $('cmp').oninput = function () { $('before').style.clipPath = 'inset(0 ' + (100 - this.value) + '% 0 0)'; };
  $('save').onclick = function () {
    last.res.canvas.toBlob(function (b) {
      var a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'cutout.png'; a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 5000);
    }, 'image/png');
  };
  window.__bgLab = { go: go };
  checkAvail();
})();
</script>
</body>
</html>
